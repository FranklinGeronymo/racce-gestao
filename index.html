<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--
  Política de segurança de conteúdo: o navegador só executa scripts deste site e só se conecta a ele e ao Supabase.
  Scripts injetados (XSS) e envio de dados para outros endereços ficam bloqueados.
  Se o Supabase usar um domínio próprio, troque https://*.supabase.co pelo endereço dele em connect-src.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Sistema de gestão da Racce: vendas, estoque, despesas e resultado.">
<meta name="theme-color" content="#000000">
<title>Racce Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@1,900&display=swap">
<style>
/*
 * Racce · Gestão da loja — identidade conforme o Manual de Marca 2.1.
 * Layout: aplicativo de gestão. Menu lateral preto com a marca original (no celular vira barra inferior)
 * e área de trabalho em Gelo com cartões brancos. Inter em todos os textos, títulos em peso 600,
 * sem itálico nem caixa-alta. O Volt aparece só como sinal: item ativo do menu, contadores e estado "salvo".
 */
:root{
  --preto:#000000; --branco:#FFFFFF; --volt:#CCFF3D; --grafite:#1A1A1C; --chumbo:#2C2C2F; --aco:#5E5E63; --cinza:#9A9AA0; --nevoa:#E6E6E8; --gelo:#F4F4F5; --volt-escuro:#4E6A00;

  --bg:var(--gelo); --surface:var(--branco); --surface-2:#F8F8F9; --hover:#F2F2F3;
  --ink:#0B0B0C; --ink-2:var(--aco); --faint:var(--cinza);
  --line:var(--nevoa); --line-2:#D5D5D9;
  --side:var(--preto); --side-ink:var(--branco); --side-2:var(--cinza); --side-hover:var(--grafite); --side-ativo:var(--chumbo); --side-line:#26262A;
  --btn:var(--preto); --btn-ink:var(--branco);
  --pos:var(--volt-escuro); --pos-soft:#EEF5DA; --bad:#B3261E; --bad-soft:#FBE9E7; --warn:#7A5200; --warn-soft:#FBF1D6;
  --bar:var(--chumbo); --meta:var(--preto); --grid:#EDEDEF; --axis:#C9C9CE;
  --focus:var(--preto); --link:var(--volt-escuro); --bg-foto:var(--gelo);
  --shadow:0 24px 64px rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.06);
  --sombra-card:0 1px 2px rgba(0,0,0,.04);
  --veu:rgba(10,10,12,.45);
  --f-body:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E0E10; --surface:var(--grafite); --surface-2:#202023; --hover:#232326;
    --ink:#F4F4F5; --ink-2:var(--cinza); --faint:var(--aco);
    --line:var(--chumbo); --line-2:#3A3A3E;
    --side:var(--preto); --side-ink:var(--branco); --side-2:var(--cinza); --side-hover:var(--grafite); --side-ativo:var(--chumbo); --side-line:#26262A;
    --btn:var(--branco); --btn-ink:var(--preto);
    --pos:var(--volt); --pos-soft:#232B0C; --bad:#FF8A7E; --bad-soft:#3A1714; --warn:#F2C14E; --warn-soft:#30250B;
    --bar:#C9C9CE; --meta:var(--volt); --grid:#26262A; --axis:#4A4A4F;
    --focus:var(--volt); --link:var(--volt); --bg-foto:#232326;
    --shadow:0 24px 64px rgba(0,0,0,.6);
    --sombra-card:none;
    --veu:rgba(0,0,0,.66);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E0E10; --surface:var(--grafite); --surface-2:#202023; --hover:#232326;
  --ink:#F4F4F5; --ink-2:var(--cinza); --faint:var(--aco);
  --line:var(--chumbo); --line-2:#3A3A3E;
  --side:var(--preto); --side-ink:var(--branco); --side-2:var(--cinza); --side-hover:var(--grafite); --side-ativo:var(--chumbo); --side-line:#26262A;
  --btn:var(--branco); --btn-ink:var(--preto);
  --pos:var(--volt); --pos-soft:#232B0C; --bad:#FF8A7E; --bad-soft:#3A1714; --warn:#F2C14E; --warn-soft:#30250B;
  --bar:#C9C9CE; --meta:var(--volt); --grid:#26262A; --axis:#4A4A4F;
  --focus:var(--volt); --link:var(--volt); --bg-foto:#232326;
  --shadow:0 24px 64px rgba(0,0,0,.6);
  --sombra-card:none;
  --veu:rgba(0,0,0,.66);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.dir{text-align:right}
.fraco{color:var(--ink-2)}
.pos{color:var(--pos)} .neg{color:var(--bad)}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
input,select,textarea{text-transform:none;letter-spacing:normal}

/* ---------- estrutura: menu lateral + área de trabalho */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--side)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh;background:linear-gradient(90deg,var(--side) 0 232px,var(--bg) 232px)}
.lateral{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow-y:auto;background:var(--side);color:var(--side-ink);border-right:1px solid var(--side-line);display:flex;flex-direction:column;padding-block:24px 16px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;z-index:30}
.marca{display:block;color:var(--side-ink);padding:4px 10px}
.marca svg{display:block;width:112px;height:11.62px}
.lateral-rot{font-size:12.5px;color:var(--side-2);padding:6px 10px 0}
.btn-venda{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;margin:22px 0 18px;border:0;border-radius:6px;background:var(--branco);color:var(--preto);font:700 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.btn-venda:hover{background:var(--nevoa)}
.btn-venda .ic{width:16px;height:16px;stroke-width:2.2}
.lateral :focus-visible,.topo-movel :focus-visible{outline-color:var(--volt)}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button{position:relative;display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--side-2);padding:10px 10px;border-radius:6px;font:700 11.5px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;text-align:left}
.menu button .ic{width:20px;height:20px}
.menu button:hover{background:var(--side-hover);color:var(--side-ink)}
.menu button[aria-current="page"]{background:var(--side-ativo);color:var(--side-ink)}
.menu button[aria-current="page"] .ic{color:var(--volt)}
.menu .conta{margin-left:auto;background:var(--volt);color:var(--preto);font:600 11px/1 var(--f-body);border-radius:999px;padding:3px 7px;font-variant-numeric:tabular-nums}
.menu-sep{height:1px;background:var(--side-line);margin:10px 4px}
.lateral-pe{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--side-line)}
.status{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--side-2);white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--aco);flex:none}
.status.ok i{background:var(--volt)}
.status.ex i{background:var(--branco)}
.topo-movel{display:none}
.conteudo{min-width:0;display:flex;flex-direction:column}

.aviso-modo{background:var(--surface);border-bottom:1px solid var(--line)}
.aviso-modo .in{max-width:1280px;margin:0 auto;padding-block:10px;padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.aviso-modo b{color:var(--ink);font-weight:600}
.aviso-modo .tag{background:var(--volt);color:var(--preto);font:600 11.5px/1 var(--f-body);padding:5px 8px;border-radius:6px}
.aviso-modo .btn{margin-left:auto}

main{width:100%;max-width:1280px;margin:0 auto;padding-block:28px 72px;padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:24px}

/* ---------- cabeçalho de página */
.cab{display:flex;justify-content:space-between;align-items:flex-end;gap:14px 20px;flex-wrap:wrap;padding-bottom:4px}
.cab > div:first-child{min-width:0}
.olho{display:flex;align-items:center;gap:10px;font:700 11px/1.4 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.olho::before{content:"";width:16px;height:3px;border-radius:2px;background:var(--volt);flex:none}
h1.tit{font:600 26px/1.2 var(--f-body);letter-spacing:-.02em;margin-top:4px;text-wrap:balance}
.cab p.sub{color:var(--ink-2);margin-top:6px;max-width:72ch;font-size:14px}
.acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mesnav{display:inline-flex;align-items:stretch;height:36px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);overflow:hidden}
.mesnav button{width:34px;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.mesnav button:hover{background:var(--hover)}
.mesnav button:disabled{opacity:.35;cursor:default;background:none}
.mesnav .ic{width:16px;height:16px}
.mesnav span{min-width:132px;display:grid;place-items:center;padding:0 8px;font:600 13.5px/1 var(--f-body);border-inline:1px solid var(--line)}

/* ---------- cartões */
.grade2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.grade3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.grade21{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:24px}
.bloco{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--sombra-card)}
.bloco > header{display:flex;justify-content:space-between;align-items:flex-start;gap:8px 12px;flex-wrap:wrap}
.bloco h2{font:600 15px/1.35 var(--f-body);letter-spacing:-.005em}
.bloco header p{color:var(--ink-2);font-size:12.5px;margin-top:2px;max-width:62ch}
.vazio{padding:24px 8px;text-align:center;color:var(--ink-2);font-size:13.5px}

.kpis,.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:var(--sombra-card)}
.tile .r{font:700 11px/1.4 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-2)}
.tile .v{font:700 26px/1.2 var(--f-body);font-variation-settings:"opsz" 32;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.tile .s{font-size:12.5px;color:var(--ink-2);line-height:1.45}
.delta{font-weight:600;font-variant-numeric:tabular-nums}
.delta.sobe{color:var(--pos)} .delta.desce{color:var(--bad)}
.meta{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.meta .trilho{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.meta .trilho i{display:block;height:100%;background:var(--meta);border-radius:999px}
.meta span{font-size:12px;color:var(--ink-2)}
.meta span b{color:var(--ink);font-weight:600}

/* ---------- botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:0 16px;border-radius:6px;cursor:pointer;font:700 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn .ic{width:16px;height:16px}
.btn.pri{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.pri:hover{background:var(--btn);opacity:.86}
.btn.per{color:var(--bad)}
.btn.per:hover{border-color:var(--bad);background:var(--bad-soft)}
.btn.per.cheio{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn.per.cheio:hover{opacity:.88}
.btn.mini{height:30px;padding:0 11px;font-size:10.5px}
.btn.link{height:auto;border:0;background:none;padding:2px 0;text-decoration:underline;text-underline-offset:3px;color:var(--link);font-size:11.5px}
.btn.link:hover{background:none;color:var(--ink-2)}
.btn:disabled{opacity:.45;cursor:default}
.leitura [data-w]{display:none!important}
.filtros{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.filtros label,.campos label,.campos .campo{display:flex;flex-direction:column;gap:6px;font:700 10.5px/1.4 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);min-width:0}
.filtros .cresce{flex:1 1 240px}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=password],select{width:100%;min-width:0;height:38px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;padding:0 12px;font:400 14px/1.4 var(--f-body)}
textarea{width:100%;min-width:0;min-height:76px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 12px;font:400 14px/1.45 var(--f-body);resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--focus);outline-offset:0;border-color:var(--focus)}
input:disabled,select:disabled,textarea:disabled{opacity:.6}
input.din{text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:6px;padding:0 12px;cursor:pointer;font:600 12.5px/1 var(--f-body);white-space:nowrap}
.chip:hover{background:var(--hover)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip small{font-size:11.5px;opacity:.65}

/* ---------- tabelas */
.rolagem{position:relative;overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.tb{border-collapse:collapse;width:100%;font-size:13.5px}
.tb th{text-align:left;font:700 10.5px/1.3 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap}
.tb th.dir,.tb td.dir{text-align:right}
.tb td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:middle}
.tb tbody tr:first-child td{border-top:0}
.tb tr[data-a]{cursor:pointer}
.tb tr[data-a]:hover td{background:var(--hover)}
.tb tfoot td{font-weight:600;border-top:1px solid var(--line-2);background:var(--surface-2)}
.tb td .sub{display:block;font-size:12px;color:var(--ink-2);line-height:1.45;margin-top:1px}
.tb td.quebra{min-width:190px}
.nv{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.riscado td{color:var(--faint)}
.riscado td .riscar,.riscado .nv{text-decoration:line-through}

.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:4px;font:700 10px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.ok{background:var(--pos-soft);color:var(--pos);border-color:transparent}

/* estoque por tamanho */
.raias-t{display:flex;flex-wrap:wrap;gap:4px}
.raia{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.raia i{font-style:normal;font-weight:500;color:var(--ink-2)}
.raia b{font-weight:600;color:var(--ink)}
.raia.baixo{background:var(--warn-soft);border-color:transparent}
.raia.baixo i,.raia.baixo b{color:var(--warn)}
.raia.zero{background:var(--bad-soft);border-color:transparent}
.raia.zero i,.raia.zero b{color:var(--bad)}

/* ---------- listas */
.lista{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0;padding-top:0}
.li:last-child{padding-bottom:0}
.li .nm{min-width:0;font-weight:500;overflow-wrap:anywhere}
.li .nm small{display:block;font-weight:400;color:var(--ink-2);font-size:12px}
.li .vv{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.li .vv small{display:block;font-weight:400;color:var(--ink-2);font-size:12px}
button.li{border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%;color:inherit;font:inherit}
button.li:first-child{border-top:0}
button.li:hover .nm{text-decoration:underline;text-underline-offset:3px}

.rank{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:baseline}
.rank .nm{font-weight:500;overflow-wrap:anywhere;font-size:13.5px}
.rank .nm small{font-weight:400;color:var(--ink-2)}
.rank .vv{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap;color:var(--ink-2)}
.rank .vv b{color:var(--ink);font-weight:600}
.rank .trk{grid-column:1/-1;height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:8px}
.rank .trk i{display:block;height:100%;background:var(--bar);border-radius:999px}

.demonst{display:grid;grid-template-columns:minmax(0,1fr) max-content;font-size:14px}
.demonst > *{padding:9px 0;border-top:1px solid var(--line)}
.demonst > :nth-child(-n+2){border-top:0}
.demonst .sub2{padding-left:14px;color:var(--ink-2)}
.demonst .tot{font-weight:600;border-top:1px solid var(--line-2)}
.demonst .final{font-weight:600;font-size:16px;border-top:1px solid var(--ink);padding-top:12px}
.demonst small{display:block;color:var(--ink-2);font-size:12px;font-weight:400}

/* gráficos */
.graf{display:block;width:100%;height:auto;overflow:visible}
.graf text{font:400 11px var(--f-body);fill:var(--ink-2);font-variant-numeric:tabular-nums}
.graf .grade{stroke:var(--grid);stroke-width:1}
.graf .eixo{stroke:var(--axis);stroke-width:1}
.graf .alvo{fill:transparent}
.graf .alvo:hover{fill:var(--ink);fill-opacity:.04}
.legenda{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legenda span{display:inline-flex;align-items:center;gap:7px}
.legenda i{width:10px;height:10px;border-radius:3px;display:inline-block}
.barras{display:grid;grid-template-columns:minmax(90px,max-content) minmax(0,1fr) max-content;gap:10px 14px;align-items:center;font-size:13px}
.barras .trilha{height:10px;min-width:0;display:flex}
.barras .trilha b{display:block;height:100%;border-radius:0 3px 3px 0;background:var(--bar);min-width:2px}
.barras .num{text-align:right}
#tip{position:fixed;z-index:95;pointer-events:none;background:var(--grafite);color:var(--branco);padding:7px 10px;border-radius:8px;font-size:12px;line-height:1.45;white-space:pre-line;max-width:260px;box-shadow:0 6px 20px rgba(0,0,0,.2)}

/* ---------- camadas */
.veu{position:fixed;inset:0;background:var(--veu);display:flex;justify-content:center;align-items:flex-start;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:60}
.veu.lado{justify-content:flex-end;padding:0}
.caixa{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);display:flex;flex-direction:column;gap:16px;padding:24px;margin-block:auto}
.caixa.larga{width:min(720px,100%)}
.veu.lado .caixa{width:min(680px,100%);min-height:100%;border:0;border-left:1px solid var(--line);border-radius:0;margin:0;padding:calc(22px + env(safe-area-inset-top,0px)) max(26px,env(safe-area-inset-right,0px)) calc(32px + env(safe-area-inset-bottom,0px)) 26px;gap:18px}
.caixa > header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.caixa h2{font:600 20px/1.3 var(--f-body);letter-spacing:-.015em;overflow-wrap:anywhere}
.caixa h3{font:600 13.5px/1.4 var(--f-body);color:var(--ink);padding-top:16px;border-top:1px solid var(--line)}
.fechar{border:1px solid var(--line-2);background:var(--surface);width:34px;height:34px;border-radius:8px;cursor:pointer;display:grid;place-items:center;flex:none;color:var(--ink)}
.fechar:hover{background:var(--hover)}
.det-total{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.det-total .num{font:600 28px/1.1 var(--f-body);letter-spacing:-.02em}
.campos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.campos .larga{grid-column:1/-1}
.campos small{color:var(--ink-2);font:400 12px/1.45 var(--f-body);letter-spacing:0;text-transform:none}
.check{display:flex!important;flex-direction:row!important;align-items:center;gap:10px!important;font:400 14px/1.4 var(--f-body)!important;letter-spacing:0!important;text-transform:none!important;color:var(--ink)!important;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--ink);flex:none}
.rodape{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:4px}
.erro-form{background:var(--bad-soft);color:var(--bad);padding:10px 14px;border-radius:8px;font-weight:500;font-size:13.5px}
.nota{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--ink-2)}
.nota b{color:var(--ink)}
.nota.atencao{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
dl.ficha{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 18px;margin:0;font-size:13.5px}
dl.ficha dt{color:var(--ink-2)}
dl.ficha dd{margin:0;overflow-wrap:anywhere}
.resumo3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.resumo3 div{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.resumo3 span{display:block;font:500 12.5px/1.4 var(--f-body);color:var(--ink-2)}
.resumo3 b{font:600 19px/1.35 var(--f-body);letter-spacing:-.015em;font-variant-numeric:tabular-nums;white-space:nowrap}

/* grade de tamanhos nos formulários */
.gradeq{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.gradeq label{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface-2)}
.gradeq label span{font:600 13px/1 var(--f-body);color:var(--ink)}
.gradeq label em{font-style:normal;font:400 11.5px/1.3 var(--f-body);color:var(--ink-2);letter-spacing:0;text-transform:none}
.gradeq input{height:32px;padding:0 8px;text-align:right}
.tams{display:flex;flex-wrap:wrap;gap:6px}
.tams button{min-width:48px;padding:7px 10px;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;font:600 13px/1 var(--f-body);cursor:pointer;color:var(--ink)}
.tams button:hover{background:var(--hover)}
.tams button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tams button:disabled{opacity:.4;cursor:default;text-decoration:line-through}
.tams button small{display:block;font-weight:400;font-size:11px;margin-top:4px;opacity:.7}

/* nova venda */
.pdv-busca{position:relative}
.pdv-busca .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-2)}
.pdv-busca input{height:44px;padding-left:38px;font-size:15px}
.resultados{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.resultados button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;text-align:left;padding:10px 14px;border:0;border-top:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink)}
.resultados button:first-child{border-top:0}
.resultados button:hover{background:var(--hover)}
.resultados b{font-weight:500}
.resultados small{color:var(--ink-2);font-size:12px}
.resultados .pr{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.selec{border:1px solid var(--line-2);background:var(--surface-2);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.selec .lin{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.stepper button{width:32px;height:32px;border:0;background:none;cursor:pointer;font-size:16px;color:var(--ink)}
.stepper button:hover{background:var(--hover)}
.stepper span{min-width:30px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.carrinho .tb td{padding:9px 10px}
.carrinho input.preco{width:104px;height:32px;padding:0 8px}
.total-venda{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;font-size:13.5px}
.total-venda .fr{color:var(--ink-2)}
.total-venda .rotulo{font:600 14px/1.3 var(--f-body);align-self:end;padding-bottom:3px}
.total-venda .grande{font:600 28px/1.1 var(--f-body);letter-spacing:-.02em;align-self:end}

.entrada{min-height:52vh;display:grid;place-items:center;text-align:center}
.entrada .girando{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:gira .7s linear infinite;margin:0 auto 12px}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.entrada .girando{animation:none}}
.boas{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--sombra-card)}
.boas h2{font:600 22px/1.3 var(--f-body);letter-spacing:-.015em}
.boas p{color:var(--ink-2);max-width:62ch;font-size:14.5px}
.boas .acoes{margin-top:10px}
.passos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.passos > div{border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.passos b{width:28px;height:28px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font:600 13px/1 var(--f-body);margin-bottom:6px}
.passos h4{font-size:14px;font-weight:600}
.passos p{color:var(--ink-2);font-size:13px}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--grafite);color:var(--branco);padding:11px 16px;border-radius:10px;z-index:96;max-width:calc(100% - 32px);font-size:13.5px;box-shadow:var(--shadow)}

/* ---------- fotos dos produtos */
.foto{display:inline-grid;place-items:center;flex:none;width:40px;height:40px;border-radius:8px;overflow:hidden;background:var(--bg-foto);border:1px solid var(--line);color:var(--faint);object-fit:cover}
img.foto{display:inline-block}
.foto.f28{width:28px;height:28px;border-radius:6px}
.foto.f32{width:32px;height:32px;border-radius:7px}
.foto.f48{width:48px;height:48px;border-radius:9px}
.foto .ic{width:55%;height:55%}
.prod-cel{display:flex;align-items:center;gap:12px;min-width:0}
.prod-cel > span:last-child{min-width:0;display:block}
.rank .nm.prod-cel{gap:10px}
.ficha-prod{display:grid;grid-template-columns:184px minmax(0,1fr);gap:22px;align-items:start}
.ficha-prod > div{min-width:0;display:flex;flex-direction:column;gap:12px}
.foto-grande{position:relative;width:100%;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:var(--bg-foto);border:1px solid var(--line);display:grid;place-items:center;align-content:center;color:var(--faint);text-align:center;font-size:12.5px}
.foto-grande img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foto-grande .ic{width:36px;height:36px;display:block;margin:0 auto 8px}
.foto-acoes{display:flex;gap:6px;flex-wrap:wrap}
.foto-campo{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.foto-campo .foto-grande{width:112px;flex:none}
.foto-campo .acoes{flex-direction:column;align-items:flex-start;gap:8px}
.resultados button{grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.resultados .info{min-width:0}
.resultados .info b,.resultados .info small,.resultados .dir .pr,.resultados .dir small{display:block}

/* ---------- usuários e entrada */
.rot-curto{display:none}
.quem{display:flex;flex-direction:column;gap:10px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--side-line)}
.quem-linha{display:flex;align-items:center;gap:10px;min-width:0;width:100%;border:0;background:none;color:inherit;padding:4px;margin:-4px;border-radius:8px;text-align:left;cursor:pointer;font:inherit}
.quem-linha:hover{background:var(--side-hover)}
.quem-linha > span:nth-child(2){min-width:0;flex:1}
.quem .trocar{display:flex;align-items:center;justify-content:center;gap:8px;height:34px;width:100%;border:1px solid var(--chumbo);background:none;color:var(--side-ink);border-radius:6px;font:700 11px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.quem .trocar:hover{background:var(--side-hover)}
.quem .trocar .ic{width:16px;height:16px}
.quem b{display:block;color:var(--side-ink);font-weight:500;font-size:13.5px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quem small{display:block;color:var(--side-2);font-size:12px}
.quem .sair{border:1px solid var(--side-line);background:none;color:var(--side-2);border-radius:7px;width:32px;height:30px;cursor:pointer;display:grid;place-items:center;flex:none}
.quem .sair:hover{color:var(--side-ink);background:var(--side-hover)}
.quem .sair .ic{width:16px;height:16px}
.avatar{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;flex:none;font:600 12px/1 var(--f-body);background:var(--chumbo);color:var(--branco);letter-spacing:.02em}
.avatar.claro{background:var(--surface-2);color:var(--ink);border:1px solid var(--line-2)}
.avatar.g{width:40px;height:40px;font-size:13.5px}
.avatar-btn{border:0;padding:0;background:none;cursor:pointer;border-radius:50%;flex:none}
.pessoa{display:flex;align-items:center;gap:10px;min-width:0}
.pessoa > span:last-child{min-width:0}
.matriz th,.matriz td{text-align:center}
.matriz th:first-child,.matriz td:first-child{text-align:left}
.matriz td .ic{width:16px;height:16px;color:var(--pos);stroke-width:2.2;vertical-align:middle}
.matriz .nao{color:var(--faint)}
.chk-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.chk-grade .check{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--surface-2)}
.chk-grade .check small{display:block;color:var(--ink-2);font-size:12px;margin-top:2px}
.chk-grade .check > span{min-width:0}
.entrar{min-height:100vh;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);background:var(--bg)}
.entrar-marca{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding-block:48px;padding-left:max(44px,env(safe-area-inset-left,0px));padding-right:44px}
.entrar-marca svg{display:block;width:180px;height:18.67px}
.entrar-marca h2{font:600 28px/1.25 var(--f-body);letter-spacing:-.02em;margin-top:40px}
.entrar-marca p{color:var(--side-2);max-width:38ch;margin-top:10px;font-size:15px}
.entrar-marca small{color:var(--side-2);font-size:12.5px}
.entrar-form{display:flex;align-items:center;justify-content:center;padding-block:48px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.entrar-caixa{width:min(400px,100%);display:flex;flex-direction:column;gap:16px}
.entrar-caixa h1{font:600 24px/1.25 var(--f-body);letter-spacing:-.02em}
.entrar-caixa > p{color:var(--ink-2)}
.entrar-caixa form{display:flex;flex-direction:column;gap:14px}
.entrar-caixa label{display:flex;flex-direction:column;gap:6px;font:500 13px/1.4 var(--f-body);color:var(--ink-2)}
.entrar-caixa label small{font-weight:400;font-size:12px;letter-spacing:0;text-transform:none}
.entrar-caixa form .btn{height:42px}
.lista-usuarios{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.lista-usuarios button{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.lista-usuarios button:first-child{border-top:0}
.lista-usuarios button:hover{background:var(--hover)}
.lista-usuarios b{display:block;font-weight:500}
.lista-usuarios small{display:block;color:var(--ink-2);font-size:12.5px}
.lista-usuarios button > .ic{margin-left:auto;color:var(--faint)}
.selecionado{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.selecionado b{display:block;font-weight:500}
.selecionado small{display:block;color:var(--ink-2);font-size:12.5px}
.selecionado .btn{margin-left:auto;height:30px}
.entrar-pe{border-top:1px solid var(--line);padding-top:16px;color:var(--ink-2);font-size:13px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ---------- componentes do manual */
.tile-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.destaque{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.destaque .ic{width:22px;height:22px}
.d-preto{background:var(--preto);color:var(--volt)}
.d-volt{background:var(--volt);color:var(--preto)}
.d-gelo{background:var(--gelo);color:var(--preto)}
.d-grafite{background:var(--grafite);color:var(--branco);box-shadow:inset 0 0 0 1px var(--chumbo)}
.barra{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--preto);color:var(--branco);border-radius:12px;border:1px solid var(--side-line);overflow:hidden}
.barra > div{position:relative;display:flex;align-items:center;gap:14px;padding:16px 22px;min-width:0}
.barra > div + div::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:1px;background:var(--chumbo)}
.barra .ic{color:var(--volt);width:22px;height:22px}
.barra span{min-width:0}
.barra b{display:block;font:700 15px/1.3 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barra small{display:block;color:var(--cinza);font-size:12px;line-height:1.35}
.moldura{position:relative;padding:8px 14px}
.moldura::before,.moldura::after{content:"";position:absolute;top:0;bottom:0;width:16px;border:4px solid var(--ink)}
.moldura::before{left:0;border-right:0;border-radius:12px 0 0 12px}
.moldura::after{right:0;border-left:0;border-radius:0 12px 12px 0}

/* ---------- recibo de venda */
.caixa.recibo-caixa{width:min(1000px,100%)}
.campos.um{grid-template-columns:minmax(0,1fr)}
.recibo-grade{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:start}
.recibo-prev{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;justify-content:center;align-items:flex-start;max-height:72vh;overflow:auto;min-height:260px}
.recibo-prev > .fraco{align-self:center;font-size:13px}
.recibo-prev img{display:block;width:100%;max-width:440px;height:auto;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.14)}
.recibo-acoes{display:flex;flex-direction:column;gap:6px}
.recibo-acoes section{display:flex;flex-direction:column;gap:10px}
.recibo-acoes section:first-child h3{padding-top:0;border-top:0}
.recibo-acoes .btn{justify-content:center}
.recibo-acoes .lin{display:flex;gap:8px;flex-wrap:wrap}
.recibo-acoes .lin .btn{flex:1 1 0}
.recibo-acoes small.fraco{font-size:12px;line-height:1.45}
#impressao{display:none}
@media (max-width:900px){
  .recibo-grade{grid-template-columns:minmax(0,1fr)}
  .recibo-prev{max-height:48vh;padding:12px}
}

/* ---------- edição de vendas e histórico */
.nota.perigo{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.nota.perigo b{color:var(--bad)}
.nota.perigo ul{margin:6px 0;padding-left:18px}
.nota.ok{display:flex;gap:10px;align-items:flex-start;background:var(--pos-soft);border-color:transparent;color:var(--pos)}
.nota.ok b{color:var(--pos)}
.nota.ok .ic{flex:none;width:18px;height:18px;margin-top:1px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.senha-temp{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:6px 0 4px}
.senha-temp code{flex:1;min-width:0;font:600 20px/1.3 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;color:var(--ink);overflow-wrap:anywhere;user-select:all}
.entrar input[type=email],.entrar input[type=password]{width:100%;min-width:0;height:42px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:8px;padding:0 12px;font:400 15px/1.4 var(--f-body)}
.entrar input[type=email]:focus-visible,.entrar input[type=password]:focus-visible{outline:2px solid var(--focus);outline-offset:0;border-color:var(--focus)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
select.tam-sel{display:inline-block;width:auto;min-width:62px;height:26px;padding:0 6px;margin-left:2px;font-size:12px;border-radius:6px;vertical-align:middle}
.mudancas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mudancas li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px;padding:9px 12px;border-top:1px solid var(--line);font-size:13px;align-items:baseline}
.mudancas li:first-child{border-top:0}
.mudancas .mc{font-weight:600;color:var(--ink)}
.mudancas .mv{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;min-width:0}
.mudancas s{color:var(--ink-2);text-decoration-color:var(--bad)}
.mudancas i{font-style:normal;color:var(--ink-2)}
.mudancas b{font-weight:600}
#vDif .mudancas{background:var(--surface)}
.hist-lista{display:flex;flex-direction:column;gap:12px}
.hist-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px;align-items:start}
.hist{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.hist header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hist-tit{display:inline-flex;align-items:center;gap:10px}
.hist .hist-venda{font-size:13px;font-weight:700;text-transform:none;letter-spacing:0;color:var(--ink)}
.hist-quando{font-size:12.5px;color:var(--ink-2)}
.hist-quem{display:flex;gap:8px;align-items:center;margin:0;font-size:13px}
.hist-quem .ic{width:16px;height:16px;color:var(--ink-2);flex:none}
.hist-motivo{margin:0;font-size:13.5px;line-height:1.45;background:var(--surface-2);border-radius:8px;padding:9px 12px}
.hist-motivo span{display:block;font:700 9.5px/1.4 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-bottom:2px}
.rodape.ed{flex-wrap:wrap}
@media (max-width:900px){
  .rodape.ed .btn{flex:1 1 0;margin-right:0!important}
  .rodape.ed .btn.pri{order:-1;flex:1 1 100%}
  .hist-grade{grid-template-columns:minmax(0,1fr)}
  .mudancas li{grid-template-columns:minmax(0,1fr);gap:4px}
}

/* ---------- catálogo da Nova venda */
.btn-venda.ativo{background:var(--volt);color:var(--preto)}
.pdv{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.pdv-cat{display:flex;flex-direction:column;gap:16px;min-width:0}
.cat-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:border-color .15s}
@media (hover:hover){.pc:hover{border-color:var(--line-2)}}
.pc-foto{position:relative;aspect-ratio:4/5;width:100%;background:var(--bg-foto);border:0;padding:0;cursor:pointer;display:grid;place-items:center;color:var(--faint);overflow:hidden}
.pc-foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s}
@media (hover:hover){.pc:hover .pc-foto img{transform:scale(1.03)}}
@media (prefers-reduced-motion: reduce){.pc-foto img,.pc{transition:none}}
.pc-foto > .ic{width:44px;height:44px}
.pc.sem .pc-foto img,.pc.sem .pc-foto > .ic{opacity:.45}
.pc-selo{position:absolute;top:10px;left:10px;z-index:1;background:var(--volt);color:var(--preto);font:700 10px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:6px 8px;border-radius:3px}
.pc-selo.na{background:var(--preto);color:var(--branco)}
.pc-selo.esg{background:var(--branco);color:var(--bad);box-shadow:inset 0 0 0 1px var(--nevoa)}
.pc-info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px;flex:1}
.pc-rot{font:700 9.5px/1.3 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.pc-nome{font:600 15px/1.3 var(--f-body);text-align:left;border:0;background:none;padding:0;cursor:pointer;color:var(--ink)}
.pc-nome:hover{text-decoration:underline;text-underline-offset:3px}
.pc-sub{font-size:12px;color:var(--ink-2)}
.pc-preco{font:700 18px/1.25 var(--f-body);font-variation-settings:"opsz" 32;font-variant-numeric:tabular-nums;margin-top:2px}
.pc-desc{font-size:12.5px;line-height:1.45;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pc-est{font-size:12px;color:var(--ink-2)}
.pc-tams{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:8px}
.pc-tams button{display:inline-flex;align-items:center;gap:5px;min-width:42px;height:34px;padding:0 9px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--ink);font:700 12px/1 var(--f-body);cursor:pointer}
.pc-tams button small{font-weight:500;font-size:11px;color:var(--ink-2)}
@media (hover:hover){.pc-tams button:not(:disabled):hover{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pc-tams button:not(:disabled):hover small{color:inherit}}
.pc-tams button:not(:disabled):active{background:var(--volt);border-color:var(--volt);color:var(--preto)}
.pc-tams button.baixo small{color:var(--warn)}
.pc-tams button:disabled{opacity:.4;cursor:default;text-decoration:line-through;background:var(--surface);color:var(--ink)}
.pdv-sacola{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow-y:auto}
.sac-lista{display:flex;flex-direction:column}
.sac-item{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.sac-item:first-child{border-top:0;padding-top:0}
.sac-info{min-width:0}
.sac-info b{display:block;font-weight:600;font-size:13.5px;line-height:1.3}
.sac-info small{display:block;color:var(--ink-2);font-size:12px;margin:2px 0 8px}
.sac-info .stepper button{width:28px;height:28px}
.sac-preco{display:flex;flex-direction:column;align-items:flex-end;gap:8px;font-size:13.5px}
.sac-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;border-top:1px solid var(--line-2);font-size:14px}
.sac-total b{font:700 22px/1 var(--f-body);font-variation-settings:"opsz" 32}
.pdv-barra{display:none}
.ficha-cat{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.tams button.zero small{color:var(--bad);opacity:1}
.tams button.zero[aria-pressed="true"] small{color:inherit}
.preco-g{display:block;font:700 30px/1.1 var(--f-body);font-variation-settings:"opsz" 32;font-variant-numeric:tabular-nums}

@media (max-width:1100px){
  .pdv{grid-template-columns:minmax(0,1fr) 290px}
  .cat-grade{grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
  .barra{grid-template-columns:repeat(2,minmax(0,1fr))}
  .barra > div:nth-child(3)::before{display:none}
  .barra > div:nth-child(n+3){border-top:1px solid var(--chumbo)}
  .kpis,.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grade3,.grade21{grid-template-columns:minmax(0,1fr)}
}

  .menu-sep{display:none}

  main{padding-block:20px calc(92px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

  .pdv-barra b{display:block;font:700 18px/1.15 var(--f-body);font-variation-settings:"opsz" 32}
  .pdv-barra small{color:var(--ink-2);font-size:12px}

  .cat-grade{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

}
@media (max-width:600px){
  .grade2,.passos,.campos,.resumo3{grid-template-columns:minmax(0,1fr)}

}
